name: Test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# 連續推送時，舊的測試直接取消（只需要最新一次的結果）
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run check-repo
      - run: npm ci
      - run: npm test
      # 與正式部署相同：官方固定版本模型 + SHA-256 驗證
      - run: npm run fetch-models
      - run: npm run build
      - run: npm run verify-dist
      # Playwright 瀏覽器快取（版本由 package-lock 決定）
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw.outputs.cache-hit == 'true'
      - name: E2E（模擬 iPhone 13 與 Pixel 7，本機 AI 推論）
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8.0.3 http://localhost:4173/my-ai-wardrobe/ --timeout 30000
          node tests/e2e/fetch-photos.mjs
          node tests/e2e/run.mjs "iPhone 13"
          node tests/e2e/run.mjs "Pixel 7"
      # 以模擬 GitHub Pages 的伺服器（找不到的路徑回 404.html）測試部署行為
      - name: 部署行為（重新整理、深層網址、離線、Service Worker）
        run: |
          node tools/serve-pages.mjs 4174 &
          npx --yes wait-on@8.0.3 http://localhost:4174/my-ai-wardrobe/ --timeout 30000
          LIVE_URL=http://localhost:4174/my-ai-wardrobe/ EXPECT_BUILD=${{ github.sha }} node tests/e2e/live-check.mjs
          node tests/e2e/update-check.mjs
